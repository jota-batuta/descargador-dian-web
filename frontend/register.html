<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro — Batuta AI · DIAN Downloader</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/brand.css">
  <style>
    .auth-card { max-width: 480px; }
    .auth-header {
      text-align: center;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .auth-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--bruma-clara);
      letter-spacing: -0.01em;
    }
    .auth-subtitle {
      font-size: 0.88rem;
      color: var(--bruma);
      margin: 4px 0 12px;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  </style>
</head>
<body>
  <div class="bt-hero-glow"></div>
  <div class="bt-center-screen bt-above-glow">
    <div class="bt-card auth-card">
      <div class="auth-header">
        <a href="https://www.batutaai.com" target="_blank" rel="noopener"
           class="bt-brand" aria-label="Batuta AI — sitio principal">
          <img src="/static/logo.svg" alt="" width="32" height="32">
          <span>Batuta <span class="bt-brand-accent">AI</span></span>
        </a>
        <div>
          <div class="auth-title">Crear cuenta</div>
          <div class="auth-subtitle">DIAN Downloader</div>
          <span class="bt-chip">Prueba gratuita 120 días</span>
        </div>
      </div>

      <form id="regForm">
        <label class="bt-label" for="full_name">Nombre completo</label>
        <input class="bt-input" type="text" id="full_name" name="full_name" required minlength="3" placeholder="Juan Pérez">

        <label class="bt-label" for="email">Correo electrónico</label>
        <input class="bt-input" type="email" id="email" name="email" required placeholder="tu@empresa.com">

        <div class="row">
          <div>
            <label class="bt-label" for="phone">Teléfono</label>
            <input class="bt-input" type="tel" id="phone" name="phone" required placeholder="+57 300 000 0000">
          </div>
          <div>
            <label class="bt-label" for="organization">Empresa / NIT</label>
            <input class="bt-input" type="text" id="organization" name="organization" required placeholder="Mi Empresa SAS">
          </div>
        </div>

        <label class="bt-label" for="password">Contraseña</label>
        <input class="bt-input" type="password" id="password" name="password" required minlength="8" placeholder="Mínimo 8 caracteres">
        <p class="bt-hint">Al menos 8 caracteres</p>

        <label class="bt-label" for="password_confirm">Confirmar contraseña</label>
        <input class="bt-input" type="password" id="password_confirm" name="password_confirm" required placeholder="Repite la contraseña">

        <button class="bt-btn bt-btn-primary" type="submit" id="submitBtn">Crear cuenta y comenzar</button>
      </form>

      <div class="bt-alert-error" id="errorMsg" style="display:none"></div>

      <p class="bt-footer-link">¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></p>
    </div>
  </div>

  <script>
    const form = document.getElementById('regForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';

      const pass = document.getElementById('password').value;
      const confirm = document.getElementById('password_confirm').value;
      if (pass !== confirm) {
        errorMsg.textContent = 'Las contraseñas no coinciden.';
        errorMsg.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creando cuenta...';

      const data = new FormData(form);
      try {
        const res = await fetch('/auth/register', { method: 'POST', body: data });
        if (res.redirected) { window.location.href = res.url; return; }
        if (res.ok) { window.location.href = '/app.html'; return; }
        const body = await res.json().catch(() => ({}));
        errorMsg.textContent = body.detail || 'Error al registrar. Intenta de nuevo.';
        errorMsg.style.display = 'block';
      } catch {
        errorMsg.textContent = 'Error de conexión. Intenta de nuevo.';
        errorMsg.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Crear cuenta y comenzar';
      }
    });
  </script>
</body>
</html>
