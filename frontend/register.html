<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro — Dian Downloader Batuta</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 0;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
      padding: 40px 36px;
      width: 100%;
      max-width: 460px;
    }
    .brand { text-align: center; margin-bottom: 28px; }
    .brand h1 { font-size: 1.5rem; font-weight: 700; color: #111; letter-spacing: -.5px; }
    .brand span { color: #E94560; }
    .trial-badge {
      display: inline-block;
      background: #fff0f2;
      color: #E94560;
      font-size: .8rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 99px;
      margin-top: 8px;
      border: 1.5px solid #E94560;
    }
    label { display: block; font-size: .85rem; font-weight: 600; color: #444; margin-bottom: 6px; margin-top: 18px; }
    input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color .15s;
      outline: none;
    }
    input:focus { border-color: #E94560; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .btn {
      display: block; width: 100%; margin-top: 28px; padding: 12px;
      background: #E94560; color: #fff; font-size: 1rem; font-weight: 700;
      border: none; border-radius: 8px; cursor: pointer; transition: background .15s;
    }
    .btn:hover { background: #c73550; }
    .btn:disabled { background: #aaa; cursor: not-allowed; }
    .footer-link { text-align: center; margin-top: 20px; font-size: .87rem; color: #666; }
    .footer-link a { color: #E94560; text-decoration: none; font-weight: 600; }
    .error-msg {
      background: #fff0f2; border: 1.5px solid #E94560; color: #c00;
      border-radius: 8px; padding: 10px 14px; font-size: .88rem; margin-top: 16px; display: none;
    }
    .hint { font-size: .78rem; color: #888; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <h1>Dian Downloader <span>Batuta</span></h1>
      <span class="trial-badge">Prueba gratuita 120 días</span>
    </div>

    <form id="regForm">
      <label for="full_name">Nombre completo</label>
      <input type="text" id="full_name" name="full_name" required minlength="3" placeholder="Juan Pérez">

      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" required placeholder="tu@empresa.com">

      <div class="row">
        <div>
          <label for="phone">Teléfono</label>
          <input type="tel" id="phone" name="phone" required placeholder="+57 300 000 0000">
        </div>
        <div>
          <label for="organization">Empresa / NIT</label>
          <input type="text" id="organization" name="organization" required placeholder="Mi Empresa SAS">
        </div>
      </div>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required minlength="8" placeholder="Mínimo 8 caracteres">
      <p class="hint">Al menos 8 caracteres</p>

      <label for="password_confirm">Confirmar contraseña</label>
      <input type="password" id="password_confirm" name="password_confirm" required placeholder="Repite la contraseña">

      <button class="btn" type="submit" id="submitBtn">Crear cuenta y comenzar</button>
    </form>

    <div class="error-msg" id="errorMsg"></div>

    <p class="footer-link">¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></p>
  </div>

  <script>
    const form = document.getElementById('regForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';

      const pass = document.getElementById('password').value;
      const confirm = document.getElementById('password_confirm').value;
      if (pass !== confirm) {
        errorMsg.textContent = 'Las contraseñas no coinciden.';
        errorMsg.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creando cuenta...';

      const data = new FormData(form);
      try {
        const res = await fetch('/auth/register', { method: 'POST', body: data });
        if (res.redirected) { window.location.href = res.url; return; }
        if (res.ok) { window.location.href = '/app.html'; return; }
        const body = await res.json().catch(() => ({}));
        errorMsg.textContent = body.detail || 'Error al registrar. Intenta de nuevo.';
        errorMsg.style.display = 'block';
      } catch {
        errorMsg.textContent = 'Error de conexión. Intenta de nuevo.';
        errorMsg.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Crear cuenta y comenzar';
      }
    });
  </script>
</body>
</html>
