<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Batuta AI · DIAN Downloader</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/brand.css">
  <style>
    .auth-card { max-width: 440px; }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .auth-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--bruma-clara);
      letter-spacing: -0.01em;
    }
    .auth-subtitle {
      font-size: 0.88rem;
      color: var(--bruma);
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="bt-hero-glow"></div>
  <div class="bt-center-screen bt-above-glow">
    <div class="bt-card auth-card">
      <div class="auth-header">
        <a href="https://www.batutaai.com" target="_blank" rel="noopener"
           class="bt-brand" aria-label="Batuta AI — sitio principal">
          <img src="/static/logo.svg" alt="" width="32" height="32">
          <span>Batuta <span class="bt-brand-accent">AI</span></span>
        </a>
        <div>
          <div class="auth-title">Iniciar sesión</div>
          <div class="auth-subtitle">DIAN Downloader</div>
        </div>
      </div>

      <form id="loginForm">
        <label class="bt-label" for="email">Correo electrónico</label>
        <input class="bt-input" type="email" id="email" name="email" required autocomplete="email" placeholder="tu@empresa.com">

        <label class="bt-label" for="password">Contraseña</label>
        <input class="bt-input" type="password" id="password" name="password" required placeholder="••••••••">

        <button class="bt-btn bt-btn-primary" type="submit" id="submitBtn">Iniciar sesión</button>
      </form>

      <div class="bt-alert-error" id="errorMsg" style="display:none"></div>

      <p class="bt-footer-link">¿Aún no tienes cuenta? <a href="/register.html">Regístrate gratis</a></p>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Ingresando...';

      const data = new FormData(form);
      try {
        const res = await fetch('/auth/login', { method: 'POST', body: data });
        if (res.redirected) {
          window.location.href = res.url;
          return;
        }
        if (res.ok) {
          window.location.href = '/app.html';
          return;
        }
        const body = await res.json().catch(() => ({}));
        const msg = body.detail || 'Error al iniciar sesión';
        if (res.status === 403) {
          errorMsg.textContent = 'Tu período de prueba ha expirado. Contacta a Batuta AI para renovar.';
        } else {
          errorMsg.textContent = msg;
        }
        errorMsg.style.display = 'block';
      } catch {
        errorMsg.textContent = 'Error de conexión. Intenta de nuevo.';
        errorMsg.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Iniciar sesión';
      }
    });
  </script>
</body>
</html>
